# Continuous water quality station metadata for the targets workflow for data processing
# Author: Dave Bosworth
# Contact: David.Bosworth@water.ca.gov

# Define parameter suites used in this yml configuration file
.parameter_suites:
  # Base USGS WQ suite
  core_usgs_sensors: &core_usgs
    water_temp: "00010"
    sp_cond: "00095"
    turbidity: "63680"

  # Base NCRO WQ suite for CNRA downloads
  core_ncro_wq_sensors: &core_ncro_wq
    water_temp: WaterTemp
    sp_cond: ECat25C
    turbidity: Turbidity

  # Base NCRO Tide suite for CNRA downloads
  core_ncro_tide_sensors: &core_ncro_tide
    discharge: StreamFlow
    velocity: Velocity

  # Base WQA WQ suite for WQP downloads
  core_wqa_wq_sensors: &core_wqa
    water_temp: Water Temperature
    sp_cond: Specific Conductance
    turbidity: Turbidity

stations:
  - station_abbr: FPT
    station_name: Sacramento River at Freeport
    survey: USGS
    data_api: USGS
    data_api_type: continuous
    api_station_id: USGS-11447650
    parameters:
      <<: *core_usgs
      discharge: "00060"
      velocity: "72255"
    data_freq: 15-min

  - station_abbr: FPT
    station_name: Sacramento River at Freeport
    survey: USGS
    data_api: USGS
    data_api_type: daily
    api_station_id: USGS-11447650
